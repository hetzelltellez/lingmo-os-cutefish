<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3038"/>
      <stop offset="100%" stop-color="#1e2229"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38a9f5"/>
      <stop offset="100%" stop-color="#1d8cf8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#3d4450" stroke-width="1.5"/>
  <!-- Top row: two workspace screens -->
  <rect x="23" y="27" width="38" height="32" rx="6" fill="url(#tileGrad)"/>
  <rect x="67" y="27" width="38" height="32" rx="6" fill="url(#tileGrad)"/>
  <!-- Bottom row: centered third workspace screen -->
  <rect x="39" y="69" width="50" height="32" rx="6" fill="url(#tileGrad)"/>
</svg>
